apiVersion: v1
kind: ConfigMap
metadata:
  name: avatar-config
  labels:
    app: avatar-service
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  METRICS_PORT: "9090"
  MAX_UPLOAD_SIZE: "10485760"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  LOG_LEVEL: "info"
  OTEL_SERVICE_NAME: "avatars-service"
  S3_REGION: "us-east-1"
  S3_BUCKET: "avatars"
  S3_USE_PATH_STYLE: "false"
  S3_SCHEME: "https"
  RMQ_EXCHANGE: "avatars.exchange"
  RMQ_QUEUE: "avatars.processing"
