apiVersion: v1
kind: Service
metadata:
  name: avatar-service
  labels:
    app: avatar-service
spec:
  selector:
    app: avatar-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
