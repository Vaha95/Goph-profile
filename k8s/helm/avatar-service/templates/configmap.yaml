apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avatar-service.fullname" . }}-config
  labels:
    {{- include "avatar-service.labels" . | nindent 4 }}
data:
  SERVER_HOST: {{ .Values.config.serverHost | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  MAX_UPLOAD_SIZE: {{ .Values.config.maxUploadSize | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_USE_PATH_STYLE: {{ .Values.config.s3UsePathStyle | quote }}
  S3_SCHEME: {{ .Values.config.s3Scheme | quote }}
  RMQ_EXCHANGE: {{ .Values.config.rmqExchange | quote }}
  RMQ_QUEUE: {{ .Values.config.rmqQueue | quote }}
  ALLOWED_MIME_TYPES: {{ .Values.config.allowedMimeTypes | quote }}
