{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "avatar-service.fullname" . }}-migrations
  labels:
    {{- include "avatar-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "avatar-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "avatar-service.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/server"]
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "avatar-service.fullname" . }}-config
            {{- if .Values.secrets }}
            - secretRef:
                name: {{ include "avatar-service.fullname" . }}-secrets
            {{- end }}
          env:
            - name: MIGRATION_ONLY
              value: "true"
{{- end }}
