services:
  postgres:
    image: postgres:16-alpine
    container_name: avatars_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avatars
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: avatars_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: avatars_minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    container_name: avatars_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avatars
      DB_USER: postgres
      DB_PASSWORD: postgres
      S3_ENDPOINT: minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: avatars
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
      RMQ_EXCHANGE: avatars.exchange
      RMQ_QUEUE: avatars.processing
      MAX_UPLOAD_SIZE: 10485760
      CORS_ALLOWED_ORIGINS: "*"

  worker:
    build: .
    container_name: avatars_worker
    restart: unless-stopped
    command: /app/worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avatars
      DB_USER: postgres
      DB_PASSWORD: postgres
      S3_ENDPOINT: minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: avatars
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      RMQ_URL: amqp://guest:guest@rabbitmq:5672
      RMQ_EXCHANGE: avatars.exchange
      RMQ_QUEUE: avatars.processing

volumes:
  pgdata:
  minio-data:
