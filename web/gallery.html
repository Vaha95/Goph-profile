<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Gallery</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="gallery-header">
            <h1>Avatar Gallery</h1>
            <a href="/web/upload" class="btn btn-primary">Upload New</a>
        </div>

        <div class="error-banner" id="errorBanner" style="display:none"></div>

        <div class="gallery-info" id="galleryInfo"></div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>

        <div class="gallery-empty" id="galleryEmpty" style="display:none">
            <p>No avatars found for this user.</p>
            <a href="/web/upload" class="btn btn-primary">Upload the first one</a>
        </div>
    </div>

    <script src="/static/gallery.js"></script>
</body>
</html>
